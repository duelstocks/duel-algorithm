name: Update Duels

on:
  schedule:
    # Runs once a month, 1st day, 06:00 UTC.
    - cron: '0 6 1 * *'
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate duels from live SEC EDGAR data
        working-directory: scripts
        run: python generate_duels.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Auto-update duels: $(date -u +'%Y-%m-%d')"
          git push
